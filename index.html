<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Laptop 24h - Quản lý</title>
<link rel="stylesheet" href="styles/main.css" />
<style>
  #nav-links a { display: flex; align-items: center; gap: 11px; }
  .nav-ic { flex: none; opacity: .9; }
  #nav-links a:hover .nav-ic, #nav-links a.active .nav-ic { opacity: 1; }
  /* Ẩn cột Thao tác (đã có chuột phải) — nút vẫn còn trong DOM để menu chuột phải hoạt động */
  .col-hide { display: none !important; }
</style>
</head>
<body>

<!-- Màn hình đăng nhập -->
<div id="auth-screen" class="screen">
<div class="login-box">
<h2>Laptop 24h</h2>
<input id="auth-email" type="text" placeholder="Tên đăng nhập" autocomplete="username" />
<div style="position:relative;margin-bottom:8px">
<input id="auth-pass" type="password" placeholder="Mật khẩu" autocomplete="current-password" style="margin-bottom:0;padding-right:44px" />
<button id="auth-show" type="button" tabindex="-1" title="Hiện/ẩn mật khẩu" style="position:absolute;right:6px;top:0;bottom:0;width:auto!important;min-width:0;margin:0;display:flex;align-items:center;justify-content:center;background:none!important;border:none!important;box-shadow:none!important;cursor:pointer;font-size:17px;padding:0 8px;color:#666">👁</button>
</div>
<select id="auth-branch" style="width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:15px;margin-bottom:8px;color:#333;background:#fff;cursor:pointer">
  <option value="vinhlong">📍 Vĩnh Long</option>
  <option value="cantho">📍 Cần Thơ</option>
</select>
<label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#555;margin:0 0 10px;cursor:pointer;user-select:none"><input id="auth-remember" type="checkbox" style="width:auto;margin:0;cursor:pointer" /> Ghi nhớ mật khẩu</label>
<button id="auth-btn">Đăng nhập</button>
<p id="auth-err" class="error"></p>
</div>
</div>

<!-- Giao diện chính -->
<div id="app" class="screen hidden">
<nav id="sidebar">
<div class="logo">Laptop 24h</div>
<div id="branch-label" style="font-size:12px;color:rgba(255,255,255,0.75);padding:0 16px 8px;margin-top:-6px;letter-spacing:0.3px;"></div>
<ul id="nav-links">

<li><a href="#sales"><svg class="nav-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>Bán hàng</a></li>
<li><a href="#inventory"><svg class="nav-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>Kho hàng</a></li>
<li><a href="#customers"><svg class="nav-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Khách hàng</a></li>
<li><a href="#debts"><svg class="nav-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>Công nợ</a></li>

<li><a href="#stats"><svg class="nav-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>Thống kê</a></li>
<li><a href="#warranty"><svg class="nav-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>Bảo hành</a></li>
<li class="admin-only"><a href="#services"><svg class="nav-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>Dịch vụ</a></li>
<li class="admin-only"><a href="#users"><svg class="nav-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>Nhân viên</a></li>
<li class="admin-only"><a href="#settings"><svg class="nav-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>Cài đặt &amp; Ứng dụng</a></li>

<div class="sidebar-footer">
<span id="user-name"></span>
<button id="logout-btn">Đăng xuất</button>

<main id="main-content"></main>
</div>

<div id="toast-container"></div>

</body>
</html>
